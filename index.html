<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സ്മാർട്ട് ലൈബ്രറി പോർട്ടൽ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-blue-900 mb-6 text-center">സ്മാർട്ട് ലൈബ്രറി മാനേജ്മെന്റ്</h1>

        <!-- സെർച്ച് ബോക്സ് -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-6">
            <input type="text" id="searchInput" placeholder="പുസ്തകത്തിന്റെ പേരിലോ സബ്‌ടൈറ്റിലിലോ തിരയുക..." 
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- പുസ്തകം ചേർക്കാനുള്ള ഫോം -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            ഹെഡിംഗുകൾ നൽകി പുതിയ പുസ്തകം ചേർക്കുക
            <!-- ഇവിടേക്ക് Supabase-മായി ബന്ധിപ്പിക്കുന്ന കോഡ് ചേർക്കാം -->
        </div>
    </div>

</body>
</html>
