<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content5="width=device-width, initial-scale=1.0">
    <title>Smart Library Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-blue-900 mb-6 text-center">Smart Library Management</h1>

        <!-- Search Box -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-6">
            <input type="text" id="searchInput" placeholder="Pusthakathinte periloo sub-titles-iloo thirayuka..." 
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onkeyup="searchBooks()">
        </div>

        <!-- Add Book Form -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Puthiya Pusthakam Cherkkuka</h2>
            <form id="bookForm" onsubmit="addBook(event)" class="space-y-4">
                <div>
                    Pradhaana Thalakkettu (Main Title):
                    <input type="text" id="mainTitle" required class="w-full px-3 py-2 border rounded-lg mt-1">
                </div>
                <div>
                    Sub-titles / Tags:
                    <input type="text" id="subTitles" placeholder="Udaharanathinu: History, Kerala, Culture" class="w-full px-3 py-2 border rounded-lg mt-1">
                </div>
                <div>
                    Ezhuthukkaran (Author):
                    <input type="text" id="author" required class="w-full px-3 py-2 border rounded-lg mt-1">
                </div>
                <div>
                    Publisher:
                    <input type="text" id="publisher" class="w-full px-3 py-2 border rounded-lg mt-1">
                </div>
                <div>
                    Publication Year:
                    <input type="number" id="pubYear" class="w-full px-3 py-2 border rounded-lg mt-1">
                </div>
                <button type="submit" class="bg-blue-900 text-white px-6 py-2 rounded-lg hover:bg-blue-800 transition">Pusthakam Save Cheyyuka</button>
            </form>
        </div>

        <!-- Book List -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Labhyamaya Pusthakangal</h2>
            <div id="bookList" class="space-y-3">
                <!-- Data load aakum -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://luaextjlruhoyogpfmjp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_F8Mc3XmM5wXMO1p9qcmpxw_UWfAGDB5';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function addBook(event) {
            event.preventDefault();
            const title = document.getElementById('mainTitle').value;
            const subTitles = document.getElementById('subTitles').value;
            const author = document.getElementById('author').value;
            const publisher = document.getElementById('publisher').value;
            const pubYear = document.getElementById('pubYear').value ? parseInt(document.getElementById('pubYear').value) : null;

            const { data, error } = await _supabase
                .from('books')
                .insert([{ 
                    title: title, 
                    sub_titles: subTitles, 
                    author: author, 
                    publisher: publisher, 
                    publication_year: pubYear 
                }]);

            if (error) {
                alert('Pusthakam cherkkunnathil thadasam nerittu: ' + error.message);
            } else {
                alert('Pusthakam vijayamayi cherthu!');
                document.getElementById('bookForm').reset();
                loadBooks();
            }
        }

        async function loadBooks() {
            const { data, error } = await _supabase.from('books').select('*').order('created_at', { ascending: false });
            const bookList = document.getElementById('bookList');
            bookList.innerHTML = '';

            if (error) {
                bookList.innerHTML = '<p class="text-red-500">Data load cheyyunnathil pisakhu sambavichu.</p>';
                return;
            }

            if (data.length === 0) {
                bookList.innerHTML = '<p class="text-gray-500">Pusthakangalonnum labhyamalla.</p>';
                return;
            }

            data.forEach(book => {
                bookList.innerHTML += `
                    <div class="p-3 border rounded-lg bg-gray-50 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-lg text-blue-900">${book.title}</h3>
                            <p class="text-sm text-gray-600">Sub-titles: ${book.sub_titles || 'Prathyekamilla'}</p>
                            <p class="text-sm text-gray-600">Author: ${book.author} | Publisher: ${book.publisher || '-'} | Year: ${book.publication_year || '-'}</p>
                        </div>
                    </div>
                `;
            });
        }

        async function searchBooks() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                loadBooks();
                return;
            }

            const { data, error } = await _supabase
                .from('books')
                .select('*')
                .or(`title.ilike.%${query}%,sub_titles.ilike.%${query}%`);

            const bookList = document.getElementById('bookList');
            bookList.innerHTML = '';

            if (error || data.length === 0) {
                bookList.innerHTML = '<p class="text-gray-500">Phalangalonnum kandethiyilla.</p>';
                return;
            }

            data.forEach(book => {
                bookList.innerHTML += `
                    <div class="p-3 border rounded-lg bg-gray-50 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-lg text-blue-900">${book.title}</h3>
                            <p class="text-sm text-gray-600">Sub-titles: ${book.sub_titles || 'Prathyekamilla'}</p>
                            <p class="text-sm text-gray-600">Author: ${book.author} | Publisher: ${book.publisher || '-'} | Year: ${book.publication_year || '-'}</p>
                        </div>
                    </div>
                `;
            });
        }

        loadBooks();
    </script>
</body>
</html>
